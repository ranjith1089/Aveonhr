<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Password Reset Success - Aveon HR Suite</title>
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'Segoe UI', Arial, sans-serif;
    background:linear-gradient(135deg,#EEF4FF,#F5F7FA 60%);
    color:#1A1A2E; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .auth-card {
    background:#fff; border-radius:16px; padding:36px 34px;
    width:100%; max-width:480px;
    box-shadow:0 10px 40px rgba(15,30,70,0.12);
  }
  .success-badge { font-size:48px; text-align:center; margin-bottom:16px; }
  h1 { font-size:24px; font-weight:900; margin-bottom:6px; text-align:center; color:#059669; }
  .sub { font-size:14px; color:#5A6478; margin-bottom:24px; text-align:center; }
  .info-box {
    background:#F0FDF4; border:1.5px solid #86EFAC; border-radius:9px;
    padding:16px 14px; margin-bottom:20px;
  }
  .info-box label { display:block; font-size:11.5px; font-weight:700; color:#15803D; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px; }
  .info-box .value { font-size:15px; font-weight:700; color:#166534; font-family:monospace; word-break:break-all; }
  .warning { background:#FEF3C7; border:1px solid #FDE68A; color:#92400E; padding:12px 14px; border-radius:8px; margin-bottom:16px; font-size:12px; line-height:1.5; }
  .btn {
    width:100%; padding:12px; border:none; border-radius:9px;
    background:#1565C0; color:#fff; font-size:15px; font-weight:700;
    cursor:pointer; text-decoration:none; display:inline-block; text-align:center;
  }
  .btn:hover { background:#0F4C9A; }
  .back { display:block; text-align:center; margin-top:14px; font-size:12.5px; color:#94A3B8; text-decoration:none; }
</style>
</head>
<body>
  <div class="auth-card">
    <div class="success-badge">✓</div>
    <h1>Password Reset Successful!</h1>
    <p class="sub">The password has been updated. User can now login with:</p>

    <div class="info-box">
      <label>Username</label>
      <div class="value">{{ username }}</div>
    </div>

    <div class="info-box">
      <label>Password</label>
      <div class="value">{{ password }}</div>
    </div>

    <div class="warning">
      📋 <strong>Next Steps:</strong><br>
      1. Copy the username and password above<br>
      2. Share them securely with the user<br>
      3. User should change the password after first login
    </div>

    <a class="btn" href="{% url 'landing' %}">Back to Home</a>
    <a class="back" href="{% url 'admin_password_reset' %}">Reset Another Password</a>
  </div>
</body>
</html>
