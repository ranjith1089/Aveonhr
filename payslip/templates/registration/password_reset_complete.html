<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Password changed - Aveon HR Suite</title>
{% include "registration/_auth_style.html" %}
</head>
<body>
  <div class="auth-card">
    {% load static %}
    <div class="auth-brand">
      <img src="{% static 'payslip/logo.png' %}" alt="Aveon logo">
      <div>
        <div class="auth-brand-name">Aveon HR Suite</div>
        <div class="auth-brand-tag">Smart HR Automation Software</div>
      </div>
    </div>
    <h1>Password changed</h1>
    <div class="success">&#10003; Your password has been reset. You can log in with it now.</div>
    <a class="btn" href="{% url 'login' %}">Log in</a>
    <a class="back" href="{% url 'landing' %}">&larr; Back to home</a>
  </div>
</body>
</html>
