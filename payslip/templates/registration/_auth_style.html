{% include "payslip/theme/_flyon_theme.html" %}
<style>
  /* Auth-specific layer on top of the shared FlyonUI-inspired theme. */
  body {
    background:linear-gradient(135deg, var(--primary-soft), var(--base-200) 60%);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .auth-card {
    background:var(--base-100); border:1px solid var(--base-300);
    border-radius:var(--radius-lg); padding:36px 34px;
    width:100%; max-width:440px; box-shadow:var(--shadow-lg);
  }
  .auth-brand { display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .auth-brand img { width:44px; height:44px; object-fit:contain; }
  .auth-brand-name { font-size:17px; font-weight:800; letter-spacing:-.2px; }
  .auth-brand-tag { font-size:11.5px; color:var(--content-muted); }
  h1 { font-size:22px; font-weight:800; margin-bottom:6px; letter-spacing:-.3px; }
  .sub { font-size:13.5px; color:var(--content-muted); margin-bottom:22px; line-height:1.6; }
  form p { margin-bottom:14px; }
  label { display:block; font-size:12.5px; font-weight:600; color:#334155; margin-bottom:5px; }
  input[type=text], input[type=password], input[type=email] {
    width:100%; padding:11px 14px; border:1px solid var(--base-300); border-radius:var(--radius);
    font-size:14px; font-family:inherit; background:var(--base-100); color:var(--content);
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
  .btn {
    width:100%; padding:12px; border:none; border-radius:var(--radius);
    background:var(--primary); color:#fff; font-size:15px; font-weight:600;
    cursor:pointer; margin-top:6px; text-align:center; text-decoration:none; display:block;
  }
  .btn:hover { background:var(--primary-hover); }
  .alt { text-align:center; font-size:13.5px; color:var(--content-muted); margin-top:18px; }
  .alt a { color:var(--primary); font-weight:600; text-decoration:none; }
  .errors {
    background:var(--error-soft); border:1px solid #FECACA; border-radius:var(--radius);
    padding:10px 14px; font-size:13px; color:#991B1B; margin-bottom:16px;
  }
  .success {
    background:var(--success-soft); border:1px solid #BBF7D0; border-radius:var(--radius);
    padding:12px 16px; font-size:13.5px; color:#166534; margin-bottom:16px; line-height:1.6;
  }
  .back { display:block; text-align:center; margin-top:14px; font-size:12.5px; color:var(--content-faint); text-decoration:none; }
</style>
