<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Check your email - Aveon HR Suite</title>
{% include "registration/_auth_style.html" %}
</head>
<body>
  <div class="auth-card">
    {% load static %}
    <div class="auth-brand">
      <img src="{% static 'payslip/logo.png' %}" alt="Aveon logo">
      <div>
        <div class="auth-brand-name">Aveon HR Suite</div>
        <div class="auth-brand-tag">Smart HR Automation Software</div>
      </div>
    </div>
    <h1>Check your email</h1>
    <div class="success">
      If an account exists with that email, we&rsquo;ve sent a password-reset link.
      It may take a minute to arrive - check your spam folder too.
    </div>
    <a class="btn" href="{% url 'login' %}">Back to log in</a>
    <a class="back" href="{% url 'landing' %}">&larr; Back to home</a>
  </div>
</body>
</html>
