{# Payroll-specific layer on top of the shared FlyonUI-inspired theme. #}
{% include "payslip/theme/_flyon_theme.html" %}
<style>
  /* ===== Page head ===== */
  .page-head { display:flex; align-items:flex-start; justify-content:space-between;
               gap:14px; flex-wrap:wrap; margin-bottom:16px; }
  .crumb { font-size:12px; font-weight:600; color:var(--content-faint); margin-bottom:6px;
           letter-spacing:.2px; }
  .crumb a { color:var(--primary); text-decoration:none; }
  .crumb a:hover { text-decoration:underline; }

  /* ===== KPI cards ===== */
  .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr));
              gap:12px; }
  .kpi {
    position:relative; overflow:hidden; background:var(--base-100);
    border:1px solid var(--base-300); border-left:4px solid #CBD5E1; border-radius:var(--radius-lg);
    padding:14px 16px; transition:transform .12s, box-shadow .12s;
  }
  .kpi:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
  .kpi .kpi-top { display:flex; align-items:center; gap:7px; margin-bottom:7px; }
  .kpi .kpi-ico { font-size:14px; line-height:1; }
  .kpi .kpi-lbl { font-size:10.5px; font-weight:700; color:var(--content-muted);
                  text-transform:uppercase; letter-spacing:.7px; }
  .kpi .kpi-val { font-size:23px; font-weight:800; color:var(--content);
                  font-variant-numeric:tabular-nums; line-height:1.15;
                  white-space:nowrap; }
  .kpi .kpi-sub { font-size:11.5px; color:var(--content-faint); font-weight:500; margin-top:4px; }
  .kpi.is-primary { border-left-color:var(--primary); background:linear-gradient(135deg,var(--base-100),var(--primary-soft)); }
  .kpi.is-primary .kpi-val { color:var(--primary); }
  .kpi.is-good    { border-left-color:var(--success); }
  .kpi.is-good    .kpi-val { color:var(--success); }
  .kpi.is-bad     { border-left-color:var(--error); }
  .kpi.is-bad     .kpi-val { color:var(--error); }
  .kpi.is-warn    { border-left-color:var(--warning); }
  .kpi.is-warn    .kpi-val { color:var(--warning); }
  .kpi.is-muted   { border-left-color:#CBD5E1; }

  /* ===== Numeric alignment - headers must match their values ===== */
  th.num, td.num { text-align:right; font-variant-numeric:tabular-nums;
                   white-space:nowrap; }
  th.mid, td.mid { text-align:center; }

  /* ===== Delta chips ===== */
  .delta { display:inline-block; padding:2px 9px; border-radius:var(--radius-pill);
           font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; }
  .delta.up   { background:var(--success-soft); color:#166534; }
  .delta.down { background:var(--error-soft); color:#991B1B; }
  .delta.flat { background:var(--base-200); color:var(--content-muted); }

  /* ===== Collapsible section ===== */
  details.fold > summary { list-style:none; cursor:pointer; display:inline-flex;
    align-items:center; gap:7px; font-size:12.5px; font-weight:700; color:var(--primary);
    padding:7px 14px; border:1px solid var(--base-300); border-radius:var(--radius);
    background:var(--primary-soft); transition:background .15s, border-color .15s;
    user-select:none; }
  details.fold > summary::-webkit-details-marker { display:none; }
  details.fold > summary:hover { border-color:var(--primary); }
  details.fold > summary .chev { transition:transform .18s; font-size:10px; }
  details.fold[open] > summary .chev { transform:rotate(180deg); }
  details.fold > summary .more-txt { display:inline; }
  details.fold[open] > summary .more-txt { display:none; }
  details.fold > summary .less-txt { display:none; }
  details.fold[open] > summary .less-txt { display:inline; }
  details.fold .fold-body { margin-top:12px; }

  /* ===== Whole-card collapse: the card header doubles as the toggle ===== */
  details.section > summary { list-style:none; cursor:pointer; display:flex;
    align-items:center; gap:10px; flex-wrap:wrap; user-select:none;
    margin:-2px 0 0; padding:2px 0; }
  details.section > summary::-webkit-details-marker { display:none; }
  details.section > summary h2 { margin-bottom:0; }
  details.section > summary .sec-chev {
    margin-left:auto; display:inline-flex; align-items:center; gap:6px;
    font-size:11.5px; font-weight:700; color:var(--primary);
    background:var(--primary-soft); border:1px solid var(--base-300); border-radius:var(--radius);
    padding:5px 11px; transition:background .15s, border-color .15s; }
  details.section > summary:hover .sec-chev { border-color:var(--primary); }
  details.section > summary .sec-chev .ico { font-size:9px; transition:transform .18s; }
  details.section[open] > summary .sec-chev .ico { transform:rotate(180deg); }
  details.section > summary .sec-chev .open-lbl { display:inline; }
  details.section[open] > summary .sec-chev .open-lbl { display:none; }
  details.section > summary .sec-chev .close-lbl { display:none; }
  details.section[open] > summary .sec-chev .close-lbl { display:inline; }
  /* Peek line - the headline number stays readable while collapsed. */
  details.section > summary .sec-peek { display:inline-flex; align-items:center;
    gap:8px; font-size:12.5px; color:var(--content-muted); font-weight:500; }
  details.section[open] > summary .sec-peek { display:none; }
  details.section > .sec-body { margin-top:14px; }

  /* ===== Wide salary grid ===== */
  .grid-tbl { font-size:12.5px; }
  .grid-tbl th, .grid-tbl td { padding:7px 9px; white-space:nowrap; }
  .grid-tbl th { background:var(--base-200); position:sticky; top:0; z-index:2; }
  /* Keep the employee name visible while scrolling the wide grid sideways. */
  .grid-tbl th:first-child, .grid-tbl td:first-child {
    position:sticky; left:0; z-index:3; background:var(--base-100);
    box-shadow:1px 0 0 var(--base-300); font-weight:600;
  }
  .grid-tbl th:first-child { z-index:4; background:var(--base-200); }
  .grid-tbl tbody tr:nth-child(even) td { background:#FBFCFE; }
  .grid-tbl tbody tr:nth-child(even) td:first-child { background:#FBFCFE; }
  .grid-tbl tbody tr:hover td,
  .grid-tbl tbody tr:hover td:first-child { background:var(--primary-soft); }
  .grid-tbl td.computed { color:var(--content-muted); text-align:right;
                          font-variant-numeric:tabular-nums; }
  .grid-tbl td.money b { color:var(--content); }
  .grid-tbl .neg { color:var(--error); font-weight:700; }
  .grid-input { width:60px !important; padding:4px 6px !important;
                font-size:12px !important; text-align:right;
                border-radius:8px !important; }
  .grid-input:focus { border-color:var(--primary) !important; }
  .grid-input.wide { width:120px !important; text-align:left; }
  /* Tint the editable columns so it's obvious what can be typed in. */
  .grid-tbl td.editable { background:#FFFBEB !important; }
  .grid-tbl tbody tr:hover td.editable { background:#FEF6D8 !important; }
  .col-note { font-size:11.5px; color:var(--content-faint); font-weight:500; }

  .tbl-scroll { overflow:auto; max-height:70vh; border:1px solid var(--base-300);
                border-radius:var(--radius); }

  .action-bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap;
                margin-top:16px; }
  .hint { background:var(--primary-soft); border:1px solid #DBE6FB; border-radius:var(--radius);
          padding:9px 13px; font-size:12.5px; color:#41546E; }
</style>
