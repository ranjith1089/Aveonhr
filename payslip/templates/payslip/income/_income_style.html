<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:#F0F4F9; color:#1A1A2E; }
  .container { max-width:1180px; margin:0 auto; padding:0 20px 60px; }

  /* ===== Sticky topbar ===== */
  .topbar {
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; flex-wrap:wrap;
    background:rgba(255,255,255,0.96); backdrop-filter:blur(6px);
    margin:0 -20px 20px; padding:14px 24px;
    border-bottom:1px solid #E2E8F0;
  }
  .topbar .brand { font-size:17px; font-weight:900; color:#1A1A2E; text-decoration:none; white-space:nowrap; }
  .topnav { display:flex; gap:4px; flex-wrap:wrap; }
  .topnav a {
    color:#475569; text-decoration:none; font-size:13px; font-weight:700;
    padding:7px 13px; border-radius:8px; transition:background .15s, color .15s;
  }
  .topnav a:hover { background:#EEF4FF; color:#1565C0; }
  .topnav a.active { background:#1565C0; color:#fff; }

  .card {
    background:#fff; border-radius:14px; padding:22px 24px;
    box-shadow:0 1px 3px rgba(15,30,70,0.08); margin-bottom:16px;
    border:1px solid #EBF0F7;
  }
  h1 { font-size:22px; font-weight:900; margin-bottom:4px; }
  h2 { font-size:13px; font-weight:800; margin-bottom:12px; color:#1565C0; text-transform:uppercase; letter-spacing:1.2px; display:flex; align-items:center; gap:8px; }
  .sub { font-size:13.5px; color:#5A6478; margin-bottom:14px; }

  /* ===== Stat cards ===== */
  .stat-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:12px; }
  .stat {
    background:linear-gradient(135deg,#FDFEFF,#F6F9FF);
    border:1.5px solid #E3EAF5; border-radius:13px; padding:16px 18px;
    transition:transform .12s, box-shadow .12s;
  }
  .stat:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(15,30,70,0.10); }
  .stat-val { font-size:21px; font-weight:900; color:#1A1A2E; font-variant-numeric:tabular-nums; }
  .stat-val.red { color:#C62828; }
  .stat-val.green { color:#2E7D32; }
  .stat-val.blue { color:#1565C0; }
  .stat-lbl { font-size:11.5px; color:#64748B; margin-top:3px; font-weight:700; letter-spacing:.3px; }

  /* ===== Progress bar ===== */
  .bar { height:7px; background:#E8EEF7; border-radius:4px; overflow:hidden; margin-top:9px; }
  .bar-fill { height:100%; border-radius:4px; background:linear-gradient(90deg,#2E7D32,#4CAF50); transition:width .3s; }
  .bar-fill.warn { background:linear-gradient(90deg,#E65100,#FB8C00); }
  .bar-lbl { font-size:10.5px; color:#94A3B8; margin-top:4px; font-weight:700; }

  /* ===== Tables ===== */
  .tbl-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#64748B; padding:8px 10px; border-bottom:2px solid #E5E7EB; white-space:nowrap; }
  td { padding:10px; border-bottom:1px solid #F1F5F9; vertical-align:middle; }
  tr:hover td { background:#F8FAFF; }
  tr.total-row td { background:#F1F5F9; font-weight:800; border-top:2px solid #CBD5E1; }
  .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .money-neg { color:#2E7D32; font-weight:700; }
  .money-due { color:#C62828; font-weight:700; }
  td a { color:#1565C0; text-decoration:none; font-weight:700; }
  td a:hover { text-decoration:underline; }

  .badge { display:inline-block; padding:2.5px 10px; border-radius:10px; font-size:10.5px; font-weight:800; white-space:nowrap; }
  .badge.green { background:#D1FAE5; color:#065F46; }
  .badge.red { background:#FEE2E2; color:#991B1B; }
  .badge.amber { background:#FEF3C7; color:#92400E; }
  .badge.blue { background:#DBEAFE; color:#1E40AF; }
  .badge.gray { background:#F1F5F9; color:#475569; }

  .btn { display:inline-block; padding:9px 18px; border:none; border-radius:9px; background:#1565C0; color:#fff; font-size:13.5px; font-weight:700; cursor:pointer; text-decoration:none; transition:background .15s; }
  .btn:hover { background:#0F4C9A; }
  .btn.secondary { background:#fff; color:#334155; border:1.5px solid #CBD5E1; }
  .btn.secondary:hover { background:#F1F5F9; }
  .btn.small { padding:6px 12px; font-size:12px; }
  .btn.danger { background:#fff; color:#C62828; border:1.5px solid #FCA5A5; }

  label { display:block; font-size:12px; font-weight:700; color:#334155; margin-bottom:4px; }
  input[type=text], input[type=number], input[type=date], input[type=email], select, textarea {
    width:100%; padding:9px 12px; border:1.5px solid #D6DEEB; border-radius:8px; font-size:13.5px; font-family:inherit; background:#fff;
  }
  input:focus, select:focus, textarea:focus { outline:none; border-color:#1565C0; box-shadow:0 0 0 3px #1565C022; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px 18px; }
  .grid .full { grid-column:1 / -1; }

  .messages { margin-bottom:14px; }
  .msg { border-radius:9px; padding:10px 16px; font-size:13.5px; margin-bottom:8px; }
  .msg.success { background:#F0FDF4; border:1px solid #BBF7D0; color:#166534; }
  .msg.error { background:#FEF2F2; border:1px solid #FECACA; color:#991B1B; }

  .inline-form { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
  .inline-form > div { flex:1; min-width:120px; }
  .muted { color:#94A3B8; font-size:12px; }

  /* Filter bar */
  .filter-bar { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:14px; }
  .filter-bar > div { min-width:140px; }

  /* Empty state */
  .empty { text-align:center; padding:32px 20px; color:#94A3B8; }
  .empty .big { font-size:34px; margin-bottom:8px; }

  /* Chart canvas */
  .chart-box { position:relative; height:280px; }
  .chart-box.tall { height:340px; }

  /* Two-column section layout */
  .two-col { display:grid; grid-template-columns:1.1fr 1fr; gap:16px; align-items:start; }

  @media (max-width:900px) { .two-col { grid-template-columns:1fr; } }
  @media (max-width:720px) {
    .grid { grid-template-columns:1fr; }
    .topbar { margin:0 -20px 16px; }
  }
</style>
