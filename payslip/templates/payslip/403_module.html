<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Access needed - Aveon HR Suite</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'Segoe UI', Arial, sans-serif; background:#F0F4F9; color:#1A1A2E;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card {
    background:#fff; border-radius:16px; padding:40px 36px; max-width:480px; width:100%;
    box-shadow:0 4px 24px rgba(15,30,70,0.10); border:1px solid #EBF0F7; text-align:center;
  }
  .big { font-size:44px; margin-bottom:14px; }
  h1 { font-size:20px; font-weight:900; margin-bottom:10px; }
  p { font-size:14px; color:#5A6478; line-height:1.6; margin-bottom:8px; }
  .module { font-weight:800; color:#1565C0; }
  .btn {
    display:inline-block; margin-top:18px; padding:10px 22px; border-radius:9px;
    background:#1565C0; color:#fff; font-size:13.5px; font-weight:700; text-decoration:none;
  }
  .btn:hover { background:#0F4C9A; }
</style>
</head>
<body>
  <div class="card">
    <div class="big">🔒</div>
    <h1>You don't have access to this module</h1>
    <p><span class="module">{{ module_label }}</span> isn't enabled for your account yet.</p>
    <p>Ask your organization admin to switch it on for you from the <b>Team</b> page.</p>
    <a class="btn" href="{% url 'landing' %}">← Back to home</a>
  </div>
</body>
</html>
